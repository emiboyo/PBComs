name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pbcoms_test
          POSTGRES_PASSWORD: pbcoms_test_password
          POSTGRES_DB: pbcoms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pbcoms_test -d pbcoms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pbcoms_test:pbcoms_test_password@localhost:5432/pbcoms_test
      DATABASE_TEST_URL: postgresql://pbcoms_test:pbcoms_test_password@localhost:5432/pbcoms_test
      BETTER_AUTH_SECRET: ci-only-authentication-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      EMAIL_DELIVERY_MODE: smtp
      SMTP_HOST: localhost
      SMTP_PORT: 2525
      SMTP_USER: ci-only
      SMTP_PASSWORD: ci-only
      SMTP_FROM: ci@pbcoms.test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm format:check
      - run: pnpm build
      - name: Verify invitation HTTP security headers
        env:
          NODE_ENV: production
        run: |
          pnpm --filter @pbcoms/web start > "$RUNNER_TEMP/pb007-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://localhost:3000/login; then
              break
            fi
            sleep 1
          done
          node --test apps/web/scripts/invitation-security-smoke.mjs
