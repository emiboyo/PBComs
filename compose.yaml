name: pbcoms

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pbcoms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pbcoms_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-pbcoms}
      POSTGRES_TEST_USER: ${POSTGRES_TEST_USER:-pbcoms_test}
      POSTGRES_TEST_PASSWORD: ${POSTGRES_TEST_PASSWORD:-pbcoms_test_password}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-pbcoms_test}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pbcoms_postgres_data:/var/lib/postgresql/data
      - ./packages/database/docker/init-test-database.sh:/docker-entrypoint-initdb.d/init-test-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  pbcoms_postgres_data:
